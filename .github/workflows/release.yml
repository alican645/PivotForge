name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve package version
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore PivotForge.slnx

      - name: Build
        run: dotnet build PivotForge.slnx -c Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test .NET packages
        run: |
          dotnet test tests/PivotForge.Core.Tests/PivotForge.Core.Tests.csproj -c Release --no-build --no-restore -p:Version=${{ env.PACKAGE_VERSION }}
          dotnet test tests/PivotForge.AspNetCore.Tests/PivotForge.AspNetCore.Tests.csproj -c Release --no-build --no-restore -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test browser assets
        run: node --test tests/*.test.js

      - name: Pack
        run: |
          dotnet pack src/PivotForge.Core/PivotForge.Core.csproj -c Release --no-build --no-restore -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/packages
          dotnet pack src/PivotForge.AspNetCore/PivotForge.AspNetCore.csproj -c Release --no-build --no-restore -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/packages

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
